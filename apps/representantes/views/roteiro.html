<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roteiro de Visitas · Grupo Catarina</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#ECEDEF;--card:#fff;--tx:#1f2937;--mut:#6b7280;--blue:#2563EB;--line:#e5e7eb;--ok:#059669;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:1rem;font-weight:700}.top small{color:var(--mut);font-weight:400;display:block;font-size:.7rem}
.btn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:9px 15px;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:default}.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.mini{padding:6px 11px;font-size:.75rem;border-radius:9px}
input,select{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.85rem}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 58px)}
@media(max-width:820px){.wrap{grid-template-columns:1fr;height:auto}#map{height:60vh}}
.side{background:#fff;border-right:1px solid var(--line);padding:16px;overflow-y:auto}
#map{height:100%;min-height:400px}
.sec{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;margin:14px 0 8px}
.ctrl{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:.8rem}
.stat b{font-size:1.1rem}
.visita{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #f1f5f9;font-size:.82rem}
.num{background:var(--blue);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex:none}
.num.prospect{background:var(--warn)}
.msg{font-size:.75rem;color:var(--mut);margin-top:6px}
.leaflet-popup-content{font-size:.8rem}
</style>
</head>
<body>
<div class="top">
  <div><h1>Roteiro de Visitas<small>Grupo Catarina · mapa e melhor rota</small></h1></div>
  <div style="flex:1"></div>
  <a class="btn ghost mini" href="/plataforma">← Plataforma</a>
</div>
<div class="wrap">
  <div class="side">
    <div id="escopoBox"></div>

    <div class="sec">Ponto de partida</div>
    <div class="ctrl">
      <input id="origem" placeholder="CEP ou cidade de onde você sai">
      <button class="btn mini" onclick="definirOrigem()">Definir origem</button>
    </div>

    <div class="sec">Carteira</div>
    <div class="row">
      <button class="btn mini" id="btnCarregar" onclick="carregar()">Carregar clientes</button>
      <button class="btn ghost mini" id="btnGeo" onclick="geocodar()">Localizar pendentes</button>
    </div>
    <div id="statCarteira" class="msg"></div>
    <div id="legenda" style="display:flex;flex-direction:column;gap:5px;margin-top:8px"></div>

    <div class="sec">Rota</div>
    <button class="btn" onclick="otimizar()" style="width:100%">🧭 Otimizar rota</button>
    <div id="statRota" style="margin-top:10px"></div>
    <div id="listaVisitas"></div>

    <div class="sec">🟡 Mapear novas lojas (prospecção)</div>
    <div class="ctrl">
      <input id="dTermo" placeholder="loja de moda infantil" value="loja de moda infantil">
      <button class="btn mini" onclick="mapearRegiao()" style="background:#eab308;color:#3a2e00">🗺️ Mapear novas lojas na região do rep</button>
      <div style="font-size:.7rem;color:var(--mut)">Varre as cidades onde o representante já atende e mapeia lojas de moda infantil que ainda não são clientes.</div>
      <div class="row" style="margin-top:6px"><input id="dCidade" placeholder="ou uma cidade específica" style="flex:1"><input id="dUf" placeholder="UF" style="width:60px"></div>
      <button class="btn ghost mini" onclick="descobrir()">Mapear só nesta cidade</button>
    </div>
    <div id="descResultado" class="msg"></div>

    <div class="sec">Adicionar prospect (manual)</div>
    <div class="ctrl">
      <input id="pNome" placeholder="Nome da loja / prospect">
      <div class="row"><input id="pCidade" placeholder="Cidade" style="flex:1"><input id="pUf" placeholder="UF" style="width:60px"></div>
      <input id="pCep" placeholder="CEP (opcional, mais preciso)">
      <button class="btn mini" onclick="addProspect()">+ Adicionar ao mapa</button>
    </div>
    <div id="msgProspect" class="msg"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const BOOT=window.__BOOT__||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let map,layerPts,layerRota,layerCand,origem=null,PONTOS=[],PROSPECTS=[],CANDIDATOS=[];

async function api(path,opt){const r=await fetch(path,opt);if(r.status===401){location.href='/';throw new Error('sessão')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;}

map=L.map('map').setView([-15.78,-47.93],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
layerPts=L.layerGroup().addTo(map);layerRota=L.layerGroup().addTo(map);layerCand=L.layerGroup().addTo(map);

// Plota as lojas descobertas (candidatas) no mapa com pino amarelo, já visíveis.
function desenharCandidatos(){
  layerCand.clearLayers();
  const cc=CANDIDATOS.filter(c=>c.lat!=null&&c.lon!=null);
  for(const L of cc){
    L2marker(L);
  }
  if(cc.length){const g=L.featureGroup([...layerPts.getLayers(),...layerCand.getLayers()]);try{map.fitBounds(g.getBounds().pad(.2));}catch{}}
}
function L2marker(loja){
  L.marker([loja.lat,loja.lon],{icon:L.divIcon({className:"",html:`<div style="background:#eab308;color:#3a2e00;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);font-size:10px">🛍️</span></div>`,iconSize:[20,20],iconAnchor:[10,20]})})
    .bindPopup(`<b>${esc(loja.nome)}</b><br>${esc(loja.endereco||loja.cidade||"")}<br><i>nova loja (Google)</i>`).addTo(layerCand);
}

// escopo: diretoria escolhe rep/UF; representante usa a própria carteira
if(BOOT.papel==='representante'){$('escopoBox').innerHTML='<div class="stat">Sua carteira</div>';}
else{$('escopoBox').innerHTML=`<div class="sec">Escopo (diretoria)</div><div class="ctrl">
  <input id="fRep" placeholder="Cód. do representante (ex.: 81)"><input id="fUf" placeholder="ou UF (ex.: PR)">
  <div class="msg">Informe um representante ou UF para não carregar a base inteira.</div></div>`;}

function escopoQS(){if(BOOT.papel==='representante')return '';const r=$('fRep')?.value.trim(),u=$('fUf')?.value.trim();return r?('rep='+encodeURIComponent(r)):u?('uf='+encodeURIComponent(u)):'';}

async function carregar(){
  const qs=escopoQS();
  if(BOOT.papel!=='representante'&&!qs){alert('Informe rep ou UF');return;}
  const b=$('btnCarregar');b.disabled=true;b.textContent='Carregando…';
  try{
    const d=await api('/api/intel/roteiro/carteira?'+qs);
    PONTOS=d.pontos;PROSPECTS=d.prospects;
    desenhar();renderLegenda();
    const uc=d.ultima_colecao?` · Ativo/Reativação vs <b>${esc(d.ultima_colecao.nome||'')}</b>`:'';
    $('statCarteira').innerHTML=`<b>${d.total}</b> clientes · <b>${d.geocodados}</b> no mapa · <b>${d.pendentes}</b> a localizar${d.pendentes?' — clique em "Localizar pendentes"':''}${uc}`;
  }catch(e){alert('Falha: '+e.message)}
  b.disabled=false;b.textContent='Carregar clientes';
}

async function geocodar(){
  const qs=escopoQS();
  const b=$('btnGeo');b.disabled=true;
  try{
    let rest=1,voltas=0;
    while(rest>0&&voltas<60){
      const r=await api('/api/intel/roteiro/geocodar?'+qs,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({limite:15})});
      rest=r.cidades_restantes;voltas++;
      b.textContent=`Localizando… (${r.pendentes} clientes restam)`;
      await carregarSilencioso();
      otimizarSeTiver();
    }
    b.textContent='Localizar pendentes';
  }catch(e){alert('Falha: '+e.message)}
  b.disabled=false;
}
async function carregarSilencioso(){const qs=escopoQS();const d=await api('/api/intel/roteiro/carteira?'+qs);PONTOS=d.pontos;PROSPECTS=d.prospects;desenhar();renderLegenda();$('statCarteira').innerHTML=`<b>${d.total}</b> clientes · <b>${d.geocodados}</b> no mapa · <b>${d.pendentes}</b> a localizar`;}

const COR_STATUS={ativo:'#059669',reativacao:'#dc2626',sem_historico:'#dc2626',prospect:'#eab308'};
const ROTULO={ativo:'Ativa',reativacao:'Inativa (reativação)',sem_historico:'Inativa (s/ histórico)',prospect:'Nova loja (prospect)'};
const FILTRO={ativo:true,reativacao:true,sem_historico:true,prospect:true};
function corDe(p){return p.tipo==='prospect'?COR_STATUS.prospect:(COR_STATUS[p.status]||'#2563EB');}
function passaFiltro(p){return p.tipo==='prospect'?FILTRO.prospect:(FILTRO[p.status]!==false);}
function todosPontos(){return [...PONTOS,...PROSPECTS].filter(p=>p.lat!=null&&p.lon!=null&&passaFiltro(p));}
function otimizarSeTiver(){if(todosPontos().length>=2&&document.querySelector('.visita'))otimizar();}

function toggleFiltro(k){FILTRO[k]=!FILTRO[k];desenhar();renderLegenda();}
function renderLegenda(){
  const cont={ativo:0,reativacao:0,sem_historico:0,prospect:0};
  for(const p of PONTOS)cont[p.status]=(cont[p.status]||0)+1;
  cont.prospect=PROSPECTS.length;
  $('legenda').innerHTML=['ativo','reativacao','sem_historico','prospect'].map(k=>`
    <label style="display:inline-flex;align-items:center;gap:5px;font-size:.74rem;cursor:pointer;opacity:${FILTRO[k]?1:.4}">
      <input type="checkbox" ${FILTRO[k]?'checked':''} onchange="toggleFiltro('${k}')" style="margin:0">
      <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${COR_STATUS[k]}"></span>
      ${ROTULO[k]} <b>${cont[k]||0}</b></label>`).join('');
}

function desenhar(){
  layerPts.clearLayers();
  const pts=todosPontos();
  for(const p of pts){
    L.circleMarker([p.lat,p.lon],{radius:6,color:'#fff',weight:1.5,fillColor:corDe(p),fillOpacity:.9})
      .bindPopup(`<b>${esc(p.nome)}</b><br>${esc(p.cidade||'')}/${esc(p.uf||'')}<br><i>${p.tipo==='prospect'?'Prospect':ROTULO[p.status]||''}</i>`)
      .addTo(layerPts);
  }
  if(origem)L.marker([origem.lat,origem.lon]).addTo(layerPts).bindPopup('<b>Origem</b><br>'+esc(origem.display||'')).openPopup();
  if(pts.length){const g=L.featureGroup([...layerPts.getLayers()]);try{map.fitBounds(g.getBounds().pad(.2));}catch{}}
}

async function definirOrigem(){
  const v=$('origem').value.trim();if(!v)return;
  const cep=v.replace(/\D/g,'').length>=8;
  try{origem=await api('/api/intel/roteiro/origem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(cep?{cep:v}:{cidade:v})});desenhar();}
  catch(e){alert('Origem: '+e.message)}
}

// haversine km
function dist(a,b){const R=6371,rad=x=>x*Math.PI/180;const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function custoRota(seq,ini){let t=0,prev=ini;for(const p of seq){t+=dist(prev,p);prev=p;}return t;}

function otimizar(){
  const pts=todosPontos();
  if(pts.length<2){alert('Poucos pontos no mapa. Carregue e localize a carteira.');return;}
  const ini=origem||pts[0];
  // nearest-neighbor
  let rest=pts.slice(),seq=[],cur=ini;
  while(rest.length){let bi=0,bd=Infinity;for(let i=0;i<rest.length;i++){const d=dist(cur,rest[i]);if(d<bd){bd=d;bi=i}}seq.push(rest[bi]);cur=rest[bi];rest.splice(bi,1);}
  // 2-opt
  let melhora=true,voltas=0;
  while(melhora&&voltas<40){melhora=false;voltas++;
    for(let i=0;i<seq.length-1;i++)for(let k=i+1;k<seq.length;k++){
      const nova=seq.slice(0,i).concat(seq.slice(i,k+1).reverse(),seq.slice(k+1));
      if(custoRota(nova,ini)+1e-9<custoRota(seq,ini)){seq=nova;melhora=true;}
    }
  }
  const total=custoRota(seq,ini);
  // desenha rota
  layerRota.clearLayers();
  const linha=[[ini.lat,ini.lon],...seq.map(p=>[p.lat,p.lon])];
  L.polyline(linha,{color:'#2563EB',weight:3,opacity:.7,dashArray:'6 6'}).addTo(layerRota);
  seq.forEach((p,i)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div style="background:${corDe(p)};color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)">${i+1}</div>`,iconSize:[22,22],iconAnchor:[11,11]})}).addTo(layerRota));
  $('statRota').innerHTML=`<div class="stat"><b>${total.toFixed(0)} km</b> · ${seq.length} paradas${origem?'':' <span style="color:var(--warn)">(defina a origem p/ melhor rota)</span>'}</div>`;
  $('listaVisitas').innerHTML=seq.map((p,i)=>`<div class="visita"><span class="num" style="background:${corDe(p)}">${i+1}</span><div><div>${esc(p.nome)}</div><div style="color:var(--mut);font-size:.72rem">${esc(p.cidade||'')}/${esc(p.uf||'')} · ${p.tipo==='prospect'?'prospect':(ROTULO[p.status]||'')}</div></div></div>`).join('');
}

function cardLoja(L,i){
  return `<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px">
    <div style="font-weight:600;font-size:.82rem">${esc(L.nome)}${L.rating?` <span style="color:var(--warn)">★${L.rating}</span> <span style="color:var(--mut);font-size:.66rem">(${L.avaliacoes})</span>`:''}</div>
    <div style="font-size:.72rem;color:var(--mut)">${esc(L.endereco||L.cidade||'')}${L.uf?'/'+esc(L.uf):''}</div>
    <div style="font-size:.72rem;color:var(--mut)">${L.telefone?esc(L.telefone):''}${L.site?` · <a href="${esc(L.site)}" target="_blank" rel="noopener">site</a>`:''}</div>
    <div class="row" style="margin-top:6px">
      <button class="btn ok mini" onclick='addDescoberta(${JSON.stringify(L).replace(/'/g,"&#39;")})'>+ Adicionar à rota</button>
      ${(L.buscas||[]).map(b=>`<a href="${esc(b.url)}" target="_blank" rel="noopener" class="btn ghost mini" style="text-decoration:none">${esc(b.label)}</a>`).join('')}
    </div></div>`;
}
async function mapearRegiao(){
  const qs=escopoQS();
  if(BOOT.papel!=='representante'&&!qs){alert('Informe o rep ou UF no escopo acima');return;}
  const termo=$('dTermo').value.trim()||'loja de moda infantil';
  $('descResultado').innerHTML='<span class="spin"></span> Varrendo as cidades da região…';
  try{
    const r=await api('/api/intel/roteiro/descobrir-regiao?'+qs,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({termo,maxCidades:12})});
    if(!r.google_ativo){
      $('descResultado').innerHTML=`<div style="color:var(--warn);margin-bottom:6px">${esc(r.erro||'busca automática desativada')}</div>`+
        `<div style="font-size:.72rem;color:var(--mut);margin-bottom:6px">Sem a chave do Google, use as buscas por cidade da região:</div>`+
        (r.cidades_alvo||[]).map(c=>`<div style="font-size:.76rem;margin-bottom:4px"><b>${esc(c.cidade)}/${esc(c.uf)}</b> (${c.clientes} clientes) ${c.buscas.map(b=>`<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label)}</a>`).join(' · ')}</div>`).join('');
      return;
    }
    if(!r.lojas.length){$('descResultado').innerHTML=`Buscei em ${r.cidades_buscadas} cidades e não achei lojas novas.`;return;}
    CANDIDATOS=r.lojas.filter(L=>L.lat!=null);
    desenharCandidatos();
    $('descResultado').innerHTML=`<div style="font-size:.74rem;color:var(--mut);margin-bottom:6px"><b>${r.total}</b> lojas novas em ${r.cidades_buscadas} cidades — já no mapa (🛍️ amarelo):</div>`+
      `<button class="btn ok mini" style="width:100%;margin-bottom:8px" onclick="addTodasCandidatas()">+ Adicionar todas à rota (${CANDIDATOS.length})</button>`+
      r.lojas.map(cardLoja).join('');
  }catch(e){$('descResultado').innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>';}
}
async function addTodasCandidatas(){
  const lista=CANDIDATOS.slice();
  for(const L of lista){await addDescoberta(L,true);}
  CANDIDATOS=[];layerCand.clearLayers();
  desenhar();renderLegenda();
  if(origem&&todosPontos().length>=2)otimizar();
  $('descResultado').innerHTML+='<div style="color:var(--ok);font-size:.75rem;margin-top:6px">'+lista.length+' lojas adicionadas à rota.</div>';
}
async function descobrir(){
  const cidade=$('dCidade').value.trim(),uf=$('dUf').value.trim(),termo=$('dTermo').value.trim()||'loja de moda infantil';
  if(!cidade){alert('Informe a cidade');return;}
  $('descResultado').innerHTML='<span class="spin"></span> Buscando…';
  try{
    const r=await api('/api/intel/roteiro/descobrir',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cidade,uf,termo,raio:15})});
    if(r.erro){
      $('descResultado').innerHTML=`<div style="color:var(--warn);margin-bottom:6px">${esc(r.erro)}</div>`+
        (r.buscas_manuais?`<div class="row">${r.buscas_manuais.map(b=>`<a href="${esc(b.url)}" target="_blank" rel="noopener" class="btn ghost mini" style="text-decoration:none">${esc(b.label)}</a>`).join('')}</div><div style="font-size:.7rem;color:var(--mut);margin-top:6px">Sem a chave do Google, use as buscas acima e adicione manualmente abaixo.</div>`:'');
      return;
    }
    if(!r.lojas.length){$('descResultado').innerHTML='Nenhuma loja encontrada. Tente outro termo/cidade.';return;}
    CANDIDATOS=r.lojas.filter(L=>L.lat!=null);
    desenharCandidatos();
    $('descResultado').innerHTML=`<div style="font-size:.72rem;color:var(--mut);margin-bottom:6px">${r.total} lojas em ${esc(cidade)} — já no mapa (🛍️):</div>`+
      `<button class="btn ok mini" style="width:100%;margin-bottom:8px" onclick="addTodasCandidatas()">+ Adicionar todas à rota (${CANDIDATOS.length})</button>`+
      r.lojas.map(cardLoja).join('');
  }catch(e){$('descResultado').innerHTML='<span style="color:var(--bad)">'+esc(e.message)+'</span>';}
}
async function addDescoberta(L,silent){
  try{
    const p=await api('/api/intel/roteiro/prospects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
      nome:L.nome,cidade:L.cidade,uf:L.uf,endereco:L.endereco,lat:L.lat,lon:L.lon,origem:'google',rep:$('fRep')?.value.trim()})});
    PROSPECTS.push({id:p.id,nome:p.nome,cidade:p.cidade,uf:p.uf,origem:'google',lat:p.lat,lon:p.lon,tipo:'prospect'});
    if(!silent){desenhar();renderLegenda();}
  }catch(e){if(!silent)alert('Falha ao adicionar: '+e.message)}
}
async function addProspect(){
  const nome=$('pNome').value.trim();if(!nome){alert('Informe o nome');return;}
  try{
    const p=await api('/api/intel/roteiro/prospects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
      nome,cidade:$('pCidade').value.trim(),uf:$('pUf').value.trim(),cep:$('pCep').value.trim(),origem:'manual',rep:$('fRep')?.value.trim()})});
    if(p.lat==null){$('msgProspect').innerHTML='<span style="color:var(--warn)">Prospect salvo, mas endereço não localizado — revise o CEP/cidade.</span>';}
    else{$('msgProspect').innerHTML='<span style="color:var(--ok)">Prospect adicionado ao mapa.</span>';}
    PROSPECTS.push({id:p.id,nome:p.nome,cidade:p.cidade,uf:p.uf,cep:p.cep,origem:p.origem,lat:p.lat,lon:p.lon,tipo:'prospect'});
    $('pNome').value='';$('pCidade').value='';$('pUf').value='';$('pCep').value='';
    desenhar();
  }catch(e){alert('Prospect: '+e.message)}
}
</script>
</body>
</html>
