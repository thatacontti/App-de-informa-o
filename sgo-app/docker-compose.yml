# Sistema de Gestao Orcamentaria - infraestrutura de producao
# ADAPTADO para o VPS grupocatarina-vps, onde ja existe um Nginx Proxy
# Manager cuidando das portas 80/443 e do HTTPS. Aqui o portal NAO pega
# portas publicas nem emite certificado: serve em HTTP interno e o Nginx
# Proxy Manager publica em https://budget.grupocatarina.com.
#
# Sobe: portal (frontend), banco PostgreSQL (interno) e Adminer.

services:

  banco:
    image: postgres:16-alpine
    container_name: sgo-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados_banco:/var/lib/postgresql/data
      # Aplica o modelo de dados automaticamente na primeira subida
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": o banco fica acessivel apenas dentro do Docker (portal,
    # adminer e o futuro backend). Nao concorre com o PostgreSQL que ja
    # existe no servidor na porta 5432.

  portal:
    build: .
    container_name: sgo-portal
    restart: unless-stopped
    environment:
      SENHA_PORTAL_HASH: ${SENHA_PORTAL_HASH}
    depends_on:
      banco:
        condition: service_healthy
    networks:
      - default    # fala com banco e adminer
      - externa    # o Nginx Proxy Manager alcanca o portal por aqui
    # Sem "ports": quem publica na internet (80/443 + HTTPS) e o Nginx
    # Proxy Manager, encaminhando para sgo-portal:80.

  adminer:
    # Interface web do banco. Acesso somente pelo portal, em /adminer.
    image: adminer:latest
    container_name: sgo-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: banco
    networks:
      - default

  # FASE 6 DO ROTEIRO: quando o backend existir, descomente este bloco
  # api:
  #   build: ./server
  #   container_name: sgo-api
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
  #     JWT_SEGREDO: ${JWT_SEGREDO}
  #   depends_on:
  #     banco:
  #       condition: service_healthy
  #   networks:
  #     - default

volumes:
  dados_banco:

networks:
  # Rede ja existente do Nginx Proxy Manager (projeto grupocatarina-vps).
  # O nome real e preenchido em REDE_EXTERNA no .env, detectado na implantacao.
  externa:
    external: true
    name: ${REDE_EXTERNA}
