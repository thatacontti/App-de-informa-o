# Sistema de Gestão Orçamentária - infraestrutura de produção (Hostinger VPS)
# Sobe: portal (frontend + HTTPS + senha), banco PostgreSQL e Adminer (gestor do banco)

services:

  banco:
    image: postgres:16-alpine
    container_name: sgo-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados_banco:/var/lib/postgresql/data
      # Aplica o modelo de dados automaticamente na primeira subida
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backups:/backups
    ports:
      # Acessível apenas de dentro do próprio servidor (não exposto à internet)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  portal:
    build: .
    container_name: sgo-portal
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
      SENHA_PORTAL_HASH: ${SENHA_PORTAL_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      banco:
        condition: service_healthy

  adminer:
    # Interface web para consultar e administrar o banco de dados.
    # Sem porta pública: o acesso é somente pelo portal, em /adminer, com a mesma senha.
    image: adminer:latest
    container_name: sgo-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: banco

  # FASE 6 DO ROTEIRO: quando o backend existir, descomente este bloco
  # api:
  #   build: ./server
  #   container_name: sgo-api
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
  #     JWT_SEGREDO: ${JWT_SEGREDO}
  #   depends_on:
  #     banco:
  #       condition: service_healthy

volumes:
  dados_banco:
  caddy_dados:
  caddy_config:
