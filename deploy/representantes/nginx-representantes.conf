# representantes.grupocatarina.com  →  app Express (container "representantes":8080)
#
# O domínio ainda NÃO está liberado. Este arquivo já sobe funcionando em
# HTTP (porta 80) e com o desafio ACME pronto. Quando o DNS apontar e o
# certbot emitir o certificado, descomente o bloco HTTPS no final e mude
# o server HTTP para redirecionar 80 → 443.

upstream gcrep_app {
    server representantes:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name representantes.grupocatarina.com;

    client_max_body_size 30m;   # fotos do PDV na prescrição
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Desafio do Let's Encrypt (deixe SEMPRE em HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- ENQUANTO NÃO HÁ HTTPS: servir o app direto no 80 ---
    # (Depois do certbot, troque este bloco por: return 301 https://$host$request_uri;)
    location / {
        proxy_pass http://gcrep_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

