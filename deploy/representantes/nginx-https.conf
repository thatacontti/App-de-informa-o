# representantes.grupocatarina.com — variante HTTPS (ativada pelo enable-https.sh)
# Usada DEPOIS que o certificado Let's Encrypt foi emitido.
# O enable-https.sh copia este arquivo por cima de nginx-representantes.conf
# e reinicia o nginx.

upstream gcrep_app {
    server representantes:8080;
    keepalive 16;
}

# HTTP → redireciona para HTTPS (mantém o desafio ACME para renovação).
server {
    listen 80;
    listen [::]:80;
    server_name representantes.grupocatarina.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name representantes.grupocatarina.com;

    ssl_certificate     /etc/letsencrypt/live/representantes.grupocatarina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/representantes.grupocatarina.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 30m;   # fotos do PDV na prescrição
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        proxy_pass http://gcrep_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
